<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
    <meta name=apple-mobile-web-app-capable content=yes>
    <meta name=apple-mobile-web-app-status-bar-style content=black>
    <title>Sunset Arcade - Snake</title>
    <link rel="stylesheet" href="../sdpi.css">
    <script src="../sdtools.common.js"></script>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item" style="height:30px;line-height:30px;">
            <div class="sdpi-item-label">Speed</div>
            <select class="sdpi-item-value select sdProperty" id="speed" oninput="setSettings()">
                <option value="slow">slow</option>
                <option value="normal" selected>normal</option>
                <option value="fast">fast</option>
            </select>
        </div>

        <div class="sdpi-item" style="height:30px;line-height:30px;">
            <div class="sdpi-item-label">Walls</div>
            <select class="sdpi-item-value select sdProperty" id="wrap" oninput="setSettings()">
                <option value="false" selected>solid (hit wall = game over)</option>
                <option value="true">wrap around</option>
            </select>
        </div>

        <div class="sdpi-item">
            <div class="sdpi-item-label">How to play</div>
            <details class="sdpi-item-value">
                <summary>Controls</summary>
                <p>Rotate clockwise: turn right<br>
                   Rotate counter-clockwise: turn left<br>
                   Press dial / tap strip: start, pause<br>
                   Long press strip: restart</p>
            </details>
        </div>
    </div>
</body>
</html>
